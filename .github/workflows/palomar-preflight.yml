name: Palomar preflight
run-name: Palomar foundations preflight at ${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character source commit to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  foundations:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@a59f25bd8a66bf6faf3a4f4260d412989c0185ea
    with:
      repository: troyjlee/quantum-query-complexity
      commit: ${{ inputs.commit }}
      pipeline_commit: a59f25bd8a66bf6faf3a4f4260d412989c0185ea
      request_id: quantumquery
      mode: full
      execution_profile: palomar-standard-v1
      options: >-
        {"project_path":"","comparator_config_path":"Palomar/QuantumQuery/comparator.json","formalization_metadata_path":"Palomar/QuantumQuery/formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}
